<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#176b4c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>牌局 · 德州扑克记录</title>
<style>
  :root{--bg:#f4f3ee;--ink:#17211d;--muted:#69736d;--card:#fffefa;--line:#dfe2d8;--green:#176b4c;--lime:#c9ea79;--amber:#f5b94c;--red:#d35d54;--shadow:0 12px 32px #1b2c2310}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1160px;margin:auto;padding:38px 22px 70px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.eyebrow{letter-spacing:.12em;font-size:12px;color:var(--green);font-weight:800}.hero h1{margin:5px 0 0;font-size:32px;letter-spacing:-.04em}.status{background:#e4f0d2;color:var(--green);padding:9px 13px;border-radius:99px;font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:310px 1fr;gap:22px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.session{padding:21px;height:max-content}.panel h2{font-size:16px;margin:0 0 17px}.field{display:block;margin:13px 0}.field span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 11px;color:var(--ink)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;padding:12px;background:var(--green);color:white;border-radius:10px;font-weight:800;margin-top:10px}.primary:hover{background:#11563d}.record{min-height:700px;padding:25px}.empty{text-align:center;padding:105px 20px;color:var(--muted)}.empty .chip{font-size:44px;margin-bottom:12px}.empty h2{color:var(--ink);font-size:21px;margin-bottom:7px}.hand-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:19px}.hand-head h2{margin:0;font-size:21px}.hand-number{font-size:12px;color:var(--green);font-weight:800;letter-spacing:.1em}.outline{background:white;border:1px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:9px;font-weight:700}.setup{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:21px 0}.section-label{font-size:13px;font-weight:800;margin-bottom:9px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice{padding:9px 5px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted)}.choice.selected{background:var(--green);border-color:var(--green);color:#fff;font-weight:800}.cards{display:flex;gap:8px}.cardpick{padding:9px;background:#fff;border:1px solid var(--line);border-radius:8px;width:100%;text-align:center}.street{border-top:1px solid var(--line);padding:20px 0}.street-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.street-title h3{margin:0;font-size:17px}.community{display:flex;gap:7px}.board-card{border:1px dashed #aeb8ad;border-radius:8px;background:#fafbf6;padding:8px;width:50px;text-align:center}.action-form{display:grid;grid-template-columns:1.1fr 1fr 1fr auto;gap:8px;align-items:end}.action-form label{font-size:11px;font-weight:700;color:var(--muted)}.action-form select{margin-top:5px;padding:9px}.add-action{padding:10px 14px;background:var(--lime);border-radius:9px;color:#25401a;font-weight:800}.actions{margin-top:13px;display:flex;flex-wrap:wrap;gap:7px}.action-pill{background:#edf1e9;border-radius:99px;padding:7px 10px;font-size:12px}.action-pill b{color:var(--green)}.remove{margin-left:7px;color:#89948c;background:transparent;padding:0}.street-controls{display:flex;gap:8px;margin-top:16px}.advance{padding:10px 13px;background:var(--green);color:white;border-radius:9px;font-weight:800}.save{padding:11px 15px;background:var(--lime);border-radius:9px;color:#25401a;font-weight:800}.hand-list{margin-top:21px}.past{padding:13px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px}.past strong{display:block;font-size:14px}.tag{color:var(--muted);font-size:12px}@media(max-width:760px){.app{padding:18px 12px 40px}.hero{align-items:start;flex-direction:column;gap:10px;margin-bottom:16px}.hero h1{font-size:27px}.status{font-size:12px}.grid{grid-template-columns:1fr;gap:13px}.record{padding:16px;min-height:500px}.session{order:2;padding:17px}.setup{grid-template-columns:1fr;gap:18px}.choice{min-height:43px;font-size:13px}.cardpick,input,select{min-height:45px;font-size:16px}.action-form{grid-template-columns:1fr 1fr;gap:10px}.action-form button{grid-column:span 2;min-height:47px;font-size:15px}.street-controls{position:sticky;bottom:0;background:var(--card);padding:12px 0 2px}.advance,.save{min-height:47px;font-size:14px;flex:1}.outline{min-height:41px}.empty{padding:62px 15px}.panel{border-radius:14px}}
</style>
</head>
<body><main class="app"><header class="hero"><div><div class="eyebrow">LIVE POKER LOG</div><h1>线下德州 · 即时记录</h1></div><div class="status" id="status">尚未开始牌局</div></header><div class="grid"><aside class="panel session"><h2>本场牌局</h2><label class="field"><span>游戏人数</span><select id="players"><option value="2">2 人</option><option value="3">3 人</option><option value="4">4 人</option><option value="5">5 人</option><option value="6" selected>6 人</option><option value="7">7 人</option><option value="8">8 人</option><option value="9">9 人</option></select></label><label class="field"><span>我的座位号</span><input id="seat" type="number" min="1" value="1" /></label><div class="twocol"><label class="field"><span>小盲</span><input id="sb" inputmode="decimal" value="5" /></label><label class="field"><span>大盲</span><input id="bb" inputmode="decimal" value="10" /></label></div><label class="field"><span>买入总金额</span><input id="buyin" inputmode="decimal" placeholder="例如 1000" /></label><button class="primary" id="start">开始记录本场</button><div class="hand-list" id="handList"></div></aside><section class="panel record" id="workspace"><div class="empty"><div class="chip">♠</div><h2>从一场好牌开始</h2><p>填写左侧信息后，创建第一手牌。</p></div></section></div></main>
<script>
const $=s=>document.querySelector(s), positions=['Button','SB','BB','UTG','UTG+1','MP','LJ','HJ','CO'], ranks=['A','K','Q','J','T','9','8','7','6','5','4','3','2'], suits=['♠','♥','♦','♣'], acts=['Fold','Raise','Call','3bet','4bet','5bet','6bet','All-in'], sizes=['小于 1/3 底池','约 1/3 底池','约 1/2 底池','约 2/3 底池','大于 2/3 底池','满池','超池','All-in'];
let game=null,hand=null,hands=[]; const opt=a=>a.map(x=>`<option>${x}</option>`).join('');
function persist(){localStorage.setItem('poker-live-log',JSON.stringify({game,hands}))}
function choices(items,type){return `<div class="choice-grid" data-choice="${type}">${items.map(x=>`<button class="choice" data-v="${x}">${x}</button>`).join('')}</div>`}
function makeHand(){hand={number:hands.length+1,position:'',cards:[],streets:[{name:'Preflop',board:[],actions:[]}],current:0}; renderHand()}
function cardSelect(i,board=false){return `<select class="cardpick" data-card="${i}" data-board="${board}"><option value="">${board?'公共牌':'牌 '+(i+1)}</option>${ranks.flatMap(r=>suits.map(s=>`<option value="${r+s}">${r+s}</option>`)).join('')}</select>`}
function renderHand(){let st=hand.streets[hand.current], pre=hand.current===0; $('#workspace').innerHTML=`<div class="hand-head"><div><div class="hand-number">HAND #${hand.number}</div><h2>${pre?'翻牌前设定':'继续记录行动'}</h2></div><button class="outline" id="discard">放弃本手</button></div>${pre?`<div class="setup"><div><div class="section-label">我当前的位置</div>${choices(positions,'pos')}</div><div><div class="section-label">我的两张手牌</div><div class="cards">${cardSelect(0)}${cardSelect(1)}</div></div></div>`:''}${streetHTML(st)}<div class="street-controls">${hand.current<3?`<button class="advance" id="nextStreet">进入 ${['Flop','Turn','River'][hand.current]}</button>`:''}<button class="save" id="saveHand">结束并保存本手</button></div>`; bind()}
function streetHTML(st){let boardCount={Flop:3,Turn:1,River:1}[st.name]||0;return `<section class="street"><div class="street-title"><h3>${st.name==='Preflop'?'Preflop · 翻牌前':st.name}</h3>${st.board.length?`<div class="community">${st.board.map(x=>`<span class="board-card">${x}</span>`).join('')}</div>`:''}</div>${boardCount&&!st.board.length?`<div class="cards"><span class="section-label" style="padding-top:10px">公共牌</span>${Array.from({length:boardCount},(_,i)=>cardSelect(i,true)).join('')}</div>`:''}<div class="action-form"><label>玩家<select id="actor">${opt(['玩家 1','玩家 2','玩家 3','玩家 4','玩家 5','玩家 6','玩家 7','玩家 8','玩家 9'].slice(0,game.players))}</select></label><label>行动<select id="action">${opt(acts)}</select></label><label>下注尺度<select id="size">${opt(sizes)}</select></label><button class="add-action" id="addAction">添加行动</button></div><div class="actions">${st.actions.length?st.actions.map((a,i)=>`<span class="action-pill"><b>${a.actor}</b> ${a.action}${a.size?' · '+a.size:''}<button class="remove" data-remove="${i}">×</button></span>`).join(''):'<span class="tag">尚未记录行动</span>'}</div></section>`}
function bind(){document.querySelectorAll('[data-choice]').forEach(box=>box.onclick=e=>{if(!e.target.matches('button'))return; box.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));e.target.classList.add('selected');hand.position=e.target.dataset.v});document.querySelectorAll('[data-card]').forEach(el=>el.onchange=()=>{let vals=[...document.querySelectorAll(`[data-card][data-board="${el.dataset.board}"]`)].map(x=>x.value);if(el.dataset.board==='true')hand.streets[hand.current].board=vals.filter(Boolean);else hand.cards=vals.filter(Boolean)});$('#addAction').onclick=()=>{let a={actor:$('#actor').value,action:$('#action').value,size:$('#action').value==='Fold'?'':$('#size').value};hand.streets[hand.current].actions.push(a);renderHand()};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{hand.streets[hand.current].actions.splice(b.dataset.remove,1);renderHand()});$('#discard').onclick=()=>{hand=null;renderEmpty()};$('#nextStreet')&&($('#nextStreet').onclick=()=>{let names=['Flop','Turn','River'];hand.streets.push({name:names[hand.current],board:[],actions:[]});hand.current++;renderHand()});$('#saveHand').onclick=saveHand}
function saveHand(){if(!hand.position||hand.cards.length!==2){alert('请先选择位置和两张手牌。');return}hands.push(structuredClone(hand));hand=null;persist();renderEmpty();renderList()}
function renderEmpty(){$('#workspace').innerHTML=`<div class="empty"><div class="chip">♠</div><h2>${hands.length?'本手已保存':'牌局已开始'}</h2><p>${hands.length?'准备好后，创建下一手牌。':'点击下方按钮开始记录第一手。'}</p><button class="primary" style="max-width:250px" id="newHand">新建一手牌</button></div>`;$('#newHand').onclick=makeHand}
function renderList(){$('#handList').innerHTML=hands.map(h=>`<div class="past"><div><strong>#${h.number} · ${h.position}</strong><span class="tag">${h.cards.join(' ')}</span></div><span class="tag">${h.streets.length} 条街</span></div>`).join('')}
$('#start').onclick=()=>{let p=+$('#players').value,seat=+$('#seat').value;if(seat<1||seat>p){alert('座位号应在 1 到 '+p+' 之间。');return}game={players:p,seat,sb:$('#sb').value,bb:$('#bb').value,buyin:$('#buyin').value};$('#status').textContent=`${p} 人局 · 座位 ${seat} · ${game.sb}/${game.bb}`;hands=[];persist();renderList();renderEmpty()}
const saved=localStorage.getItem('poker-live-log');if(saved){try{({game,hands}=JSON.parse(saved));if(game){$('#players').value=game.players;$('#seat').value=game.seat;$('#sb').value=game.sb;$('#bb').value=game.bb;$('#buyin').value=game.buyin;$('#status').textContent=`${game.players} 人局 · 座位 ${game.seat} · ${game.sb}/${game.bb}`;renderList();renderEmpty()}}catch(e){localStorage.removeItem('poker-live-log')}}
</script></body></html>
